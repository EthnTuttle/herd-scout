[package]
name = "p2p-video-pipe-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
iroh-live = { path = "../vendor/iroh-live/iroh-live" }
moq-media-egui = { path = "../vendor/iroh-live/moq-media-egui" }
egui = "0.33"
eframe = "0.33"
tokio = { version = "1", features = ["full"] }
# `tracing` is a transitive dep of iroh-live; declared here so we can emit
# our own tracing events (info/warn/debug) from the streaming task and UI.
tracing = "0.1"
# `env-filter` is needed so `RUST_LOG` controls verbosity at runtime.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# === Wave 3: CV inference (YOLOv5n / ONNX Runtime) ===
# The design doc pinned `ort = "2.0.0-rc.10"`, but that version was yanked /
# superseded on crates.io; the latest available 2.0.0-rc.X is rc.12. The
# design doc explicitly allows dropping to whatever rc.X is available.
# rc.12 transitively requires `ndarray = "^0.17"` (rc.10 wanted 0.16), so
# we declare ndarray 0.17 to keep the version graph consistent.
# `download-binaries` makes ort fetch a prebuilt ORT 1.24 CPU shared lib at
# build time and statically wires it — no system libonnxruntime required.
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }
ndarray = "0.17"
# `image` is already pulled transitively via rusty-codecs; declare
# explicitly so `image::imageops::resize` is in scope for preprocess.rs.
# Default features are fine — we only need the resize helpers, not the
# format encoders.
image = "0.25"
# `anyhow` is already transitive via iroh-live; declare it so the cv module
# can return ergonomic Result<_, anyhow::Error> without adding our own
# error enum (Wave 3 surface; revisit if/when CV grows its own error
# taxonomy).
anyhow = "1"
# `parking_lot::RwLock` is used by the CV `DetectionSnapshot` shared state.
# Picked over `std::sync::RwLock` because the egui paint loop holds the
# read lock per frame and parking_lot's RwLock has no poisoning surface to
# `.unwrap()` away on each access.
parking_lot = "0.12"

# === Wave 5B: persistence (last-paired-ticket store) ===
# `iroh-smol-kv` is the workspace's KV CRDT (n0-computer/iroh-smol-kv branch
# `iroh-098`). The `[[iroh-docs-fms-schema]]` design treats this as the
# durable prefs/settings store. **Important**: the live `iroh-098` branch
# currently exposes only a gossip-coupled in-memory `Client` (no persistent
# backend) with a 24h default TTL; instantiating it requires a full iroh
# `Endpoint` + `iroh-gossip` + `Router`. For MVP local-only prefs that must
# survive restart, the store layer below uses a tiny on-disk JSON sidecar
# whose schema mirrors the smol-kv `(scope, key, value, timestamp)` shape so
# migration is mechanical once iroh-smol-kv gains a persistent backend (or a
# durable-prefs fork is selected). The dep is declared eagerly so this module
# can pivot to the real CRDT without a Cargo.toml change. See `src/store/`.
iroh-smol-kv = { workspace = true }
# `directories` derives the cross-platform user-data directory
# (`~/Library/Application Support/net.herd-scout.herd-scout/` on macOS,
# `~/.local/share/herd-scout/` on Linux, `%APPDATA%\herd-scout\herd-scout\`
# on Windows). v5 is current.
directories = "5"
# `serde` + `serde_json` serialise the prefs sidecar. Both already pulled
# transitively via iroh-live; declared explicitly so the store module can
# `#[derive(Serialize, Deserialize)]` without depending on a transitive
# version pin.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `rand` generates the device-author key on first launch. Already transitive
# via iroh; declared so we can call `rand::rng().fill_bytes(...)` directly.
rand = "0.9"

# === Wave 5A: QR pairing ===
# `qrcode` renders ticket strings into a black/white module grid which we
# upload as an egui texture so the phone can scan it. Already pinned at
# 0.14.1 in Cargo.lock as a transitive dep, so this declaration just makes
# it a direct dep without bumping the resolved version. `default-features =
# false` drops the `image` and `svg` rendering helpers — we walk the
# `QrCode::to_colors()` matrix directly into an `egui::ColorImage` so we
# don't need the rendering layer.
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
# Wave 5B: scoped to tests for the `store` module — a tempdir lets the
# test re-open the same store after a "restart" without touching the real
# user-data directory. `iroh` is brought in for `SecretKey` / `EndpointAddr`
# fixtures so we can synthesise a `LiveTicket` without a live endpoint.
tempfile = "3"
iroh = { workspace = true }