[package]
name = "herd-scout-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "herd-scout-daemon"
path = "src/main.rs"

[dependencies]
# === iroh-live + moq (workspace pins) ===
iroh-live = { workspace = true }
iroh-moq = { workspace = true }
# The workspace pin sets default-features = false (so other workspace crates
# can opt out of capture/audio). The daemon needs to DECODE H.264 + Opus
# from the phone's MoQ broadcast, so we re-enable those two features here.
# `capture` stays off — the daemon never captures locally; it's a subscriber.
moq-media = { workspace = true, features = ["h264", "opus"] }
iroh = { workspace = true }
iroh-smol-kv = { workspace = true }

# === Wave 6: shared IPC types ===
herd-scout-ipc = { path = "../herd-scout-ipc" }

# === Wave 12: identity envelope ===
herd-scout-identity = { path = "../herd-scout-identity" }

# === Plan-FMS Phase 1: records crate ===
herd-scout-fms = { path = "../herd-scout-fms" }
ulid = { version = "1", features = ["serde"] }

# === Async runtime + tracing ===
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
parking_lot = "0.12"

# === CV (Wave 6.5: sidecar pivot) ===
# Inference is offloaded to a Python sidecar (`deploy/cv-sidecar/`) over
# a Unix socket. The Rust `ort` crate was retired from the daemon after
# repeatedly deadlocking in static init on this project's Pascal target
# (multiple ORT versions, multiple build modes — see model.rs docstring).
# The daemon now only owns the wire protocol; image is still used for
# RGBA buffer ergonomics in the rest of the codebase.
image = "0.25"

# === Persistence (Wave 5B) ===
directories = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"

# === Wave 11: control plane ===
arc-swap = "1"
toml = "0.8"

# === Wave 12: audit log ===
time = { version = "0.3", features = ["formatting", "macros"] }

# === Wave 13: upload pipeline ===
# Streaming BLAKE3 hasher for verifying client-reported clip hashes.
# The version pin matches the iroh-blobs transitive dep already present in
# Cargo.lock so we don't trigger a rebuild of the whole tree.
blake3 = "1"

# === Rekor mirror (prototype, feature-gated) ===
# Off by default. Enabled via `--features rekor-mirror`. See
# `src/audit_mirror.rs` for the design and `deploy/README.md` for the
# operator opt-in. All deps below are *already* in Cargo.lock as
# transitives (reqwest via iroh's HTTP relays; sha2 + base64 + ed25519
# via iroh's TLS / iroh-base; serde via everywhere), so enabling this
# feature does not pull a fresh subgraph.
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls", "json"] }
ed25519-dalek = { version = "2", optional = true }

[features]
default = []
# Mirror periodic audit-log commitments to Sigstore Rekor. PROTOTYPE.
rekor-mirror = ["dep:sha2", "dep:base64", "dep:reqwest", "dep:ed25519-dalek"]

[dev-dependencies]
tempfile = "3"

[build-dependencies]

