[workspace]
members = [
    "herd-scout-daemon",
    "herd-scout-gui",
    "herd-scout-ipc",
    "android-jni",
    # iroh-live
    "vendor/iroh-live/iroh-live",
    "vendor/iroh-live/iroh-live-relay",
    "vendor/iroh-live/iroh-moq",
    "vendor/iroh-live/moq-media",
    "vendor/iroh-live/moq-media-egui",
    "vendor/iroh-live/rusty-codecs",
    "vendor/iroh-live/rusty-capture",
]
resolver = "2"

[workspace.package]
rust-version = "1.85"

[workspace.dependencies]
# iroh
iroh = { version = "0.98.0", default-features = false, features = ["metrics", "portmapper", "fast-apple-datapath", "tls-aws-lc-rs"] }
iroh-gossip = "0.98.0"
iroh-tickets = "0.5.0"
iroh-smol-kv = { git = "https://github.com/n0-computer/iroh-smol-kv", branch = "iroh-098", default-features = false }
# moq via git
hang = { git = "https://github.com/Frando/moq", branch = "deps/iroh-098" }
moq-lite = { git = "https://github.com/Frando/moq", branch = "deps/iroh-098" }
moq-mux = { git = "https://github.com/Frando/moq", branch = "deps/iroh-098" }
moq-relay = { git = "https://github.com/Frando/moq", branch = "deps/iroh-098", default-features = false }
moq-native = { git = "https://github.com/Frando/moq", branch = "deps/iroh-098", default-features = false }
web-transport-iroh = { git = "https://github.com/moq-dev/web-transport", branch = "deps/iroh-098" }

# iroh-live internal
iroh-live = { path = "vendor/iroh-live/iroh-live", default-features = false }
iroh-live-relay = { path = "vendor/iroh-live/iroh-live-relay" }
iroh-moq = { path = "vendor/iroh-live/iroh-moq" }
moq-media = { path = "vendor/iroh-live/moq-media", default-features = false }
moq-media-android = { path = "vendor/iroh-live/moq-media-android" }
moq-media-egui = { path = "vendor/iroh-live/moq-media-egui" }
rusty-codecs = { path = "vendor/iroh-live/rusty-codecs", default-features = false }
rusty-capture = { path = "vendor/iroh-live/rusty-capture", default-features = false }

[workspace.lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(docsrs)", "cfg(any_audio_codec)", "cfg(any_video_codec)", "cfg(any_codec)"] }
elided_lifetimes_in_paths = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
or_fun_call = "warn"
use_self = "warn"
unused_async = "warn"
absolute_paths = "allow"
manual_let_else = "warn"
allow_attributes_without_reason = "warn"
mod_module_files = "deny"

[profile.release]
debug = true
lto = "thin"